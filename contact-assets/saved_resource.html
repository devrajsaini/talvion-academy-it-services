<script id="talvion-offcanvas-toggle-script">
(function() {
  function initMobileDrawer() {
    function setDrawer(open) {
      var overlays = document.querySelectorAll('.jws-offcanvas-parent-wrapper, [id$="-overlay"]');
      overlays.forEach(function(el) {
        if (open) {
          el.classList.add('active');
          var drawer = el.querySelector('.jws-offcanvas');
          if (drawer) drawer.classList.add('active', 'jws-offcanvas-show');
        } else {
          el.classList.remove('active');
          var drawer = el.querySelector('.jws-offcanvas');
          if (drawer) drawer.classList.remove('active', 'jws-offcanvas-show');
        }
      });
      document.body.style.overflow = open ? 'hidden' : '';
    }

    // Direct event binding on all trigger links and buttons
    var triggers = document.querySelectorAll('.jws-offcanvas-trigger, [data-offcanvas="2b5392e"], .jws-elementor-button');
    triggers.forEach(function(t) {
      t.onclick = function(e) {
        e.preventDefault();
        e.stopPropagation();
        setDrawer(true);
      };
    });

    // Direct event binding on drawer close buttons
    var closeButtons = document.querySelectorAll('.jws-offcanvas-close, .talvion-drawer-close');
    closeButtons.forEach(function(b) {
      b.onclick = function(e) {
        e.preventDefault();
        e.stopPropagation();
        setDrawer(false);
      };
    });

    // Direct event binding on accordion toggles
    var accordionButtons = document.querySelectorAll('.talvion-accordion-btn');
    accordionButtons.forEach(function(b) {
      b.onclick = function(e) {
        e.preventDefault();
        e.stopPropagation();
        var parentLi = b.closest('.has-sub-accordion');
        if (parentLi) {
          parentLi.classList.toggle('expanded');
        }
      };
    });

    // Global click delegation
    document.addEventListener('click', function(e) {
      // 1. Hamburger button click
      var trigger = e.target.closest('.jws-offcanvas-trigger') || e.target.closest('a[data-offcanvas]');
      if (trigger) {
        e.preventDefault();
        e.stopPropagation();
        setDrawer(true);
        return;
      }

      // 2. Close button or overlay
      var closeBtn = e.target.closest('.jws-offcanvas-close') || e.target.closest('.talvion-drawer-close') || e.target.closest('.jws-offcanvas-overlay');
      if (closeBtn) {
        e.preventDefault();
        e.stopPropagation();
        setDrawer(false);
        return;
      }

      // 3. Accordion toggle
      var accBtn = e.target.closest('.talvion-accordion-btn');
      if (accBtn) {
        e.preventDefault();
        e.stopPropagation();
        var parentLi = accBtn.closest('.has-sub-accordion');
        if (parentLi) {
          parentLi.classList.toggle('expanded');
        }
        return;
      }

      // 4. Click nav link inside drawer
      var navLink = e.target.closest('.talvion-nav-link') || e.target.closest('.talvion-sub-menu a') || e.target.closest('.talvion-drawer-apply-btn');
      if (navLink && !e.target.closest('.talvion-accordion-btn')) {
        setDrawer(false);
      }
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        setDrawer(false);
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initMobileDrawer);
  } else {
    initMobileDrawer();
  }
  window.addEventListener('load', initMobileDrawer);
})();
</script>
